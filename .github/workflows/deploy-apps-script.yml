name: Deploy Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASP_SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
      CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: secrets
        run: |
          if [ -z "$CLASP_SCRIPT_ID" ] || [ -z "$CLASP_CREDENTIALS" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Secrets CLASP_SCRIPT_ID or CLASP_CREDENTIALS are missing. Skipping Apps Script deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep admin logo distinct from public bed logo
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          p = Path('src/Admin.html')
          s = p.read_text(encoding='utf-8')
          old = base64.b64decode('').decode('utf-8')
          new = base64.b64decode('').decode('utf-8')
          count = s.count(old)
          if count != 2:
            raise SystemExit(f'Expected 2 admin bed logos, found {count}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY

      - name: Setup Node
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        if: steps.secrets.outputs.ready == 'true'
        run: npm install -g @google/clasp

      - name: Configure clasp
        if: steps.secrets.outputs.ready == 'true'
        run: |
          printf '%s' "$CLASP_CREDENTIALS" > ~/.clasprc.json
          cat > .clasp.json <<JSON
          {
            "scriptId": "$CLASP_SCRIPT_ID",
            "rootDir": "src"
          }
          JSON

      - name: Push Apps Script source
        if: steps.secrets.outputs.ready == 'true'
        run: clasp push --force
