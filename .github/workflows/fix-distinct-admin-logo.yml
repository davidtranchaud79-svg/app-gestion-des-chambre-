name: Fix distinct admin logo

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-distinct-admin-logo.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Replace bed logo in admin only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/Admin.html')
          s = p.read_text(encoding='utf-8')

          pattern = re.compile(
              r'<svg viewBox="0 0 120 120">\s*'
              r'<path d="M21 50 60 21l39 29".*?'
              r'</svg>',
              re.S,
          )

          admin_svg = '''<svg viewBox="0 0 120 120" role="img" aria-label="Administration La Cayenne de Paris">
          <path d="M20 49 60 20l40 29" fill="none" stroke="#5a0d0d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M29 47v46h62V47" fill="none" stroke="#5a0d0d" stroke-width="5" stroke-linejoin="round"/>
          <path d="M60 48c12 8 20 10 27 11v15c0 15-10 25-27 32-17-7-27-17-27-32V59c7-1 15-3 27-11z" fill="#f8f3e8" stroke="#c7a766" stroke-width="4" stroke-linejoin="round"/>
          <circle cx="60" cy="72" r="8" fill="none" stroke="#5a0d0d" stroke-width="4"/>
          <path d="M60 80v11" fill="none" stroke="#5a0d0d" stroke-width="4" stroke-linecap="round"/>
          <path d="M47 99c8 4 18 6 26 0" fill="none" stroke="#c7a766" stroke-width="4" stroke-linecap="round"/>
        </svg>'''

          s2, n = pattern.subn(admin_svg, s)
          if n != 2:
              raise SystemExit(f'Expected 2 admin bed logos, found {n}')

          p.write_text(s2, encoding='utf-8')
          PY

      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-distinct-admin-logo.yml

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Admin.html .github/workflows/fix-distinct-admin-logo.yml
          git commit -m "Use separate admin logo without bed"
          git push
