<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications chambres</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7f1d1d">
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }

    body {
      margin: 0;
      padding: 24px;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 22px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .08);
    }

    h1 {
      margin: 0 0 10px;
      color: #7f1d1d;
      font-size: 28px;
    }

    p {
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      margin-top: 12px;
      background: #7f1d1d;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .status {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #334155;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Notifications chambres</h1>
    <p>Cette page sert à inscrire ton téléphone aux notifications OneSignal de l’application admin.</p>
    <p>Sur iPhone : ouvre cette page avec Safari, ajoute-la à l’écran d’accueil, puis rouvre l’icône créée avant d’appuyer sur le bouton.</p>

    <button id="subscribeBtn" type="button">Activer les notifications</button>
    <div id="status" class="status">Chargement OneSignal...</div>
  </main>

  <script>
    const ONESIGNAL_APP_ID = 'c1c76342-2445-4ad8-9335-9563c23e9854';
    const statusEl = document.getElementById('status');
    const subscribeBtn = document.getElementById('subscribeBtn');

    function setStatus(message) {
      statusEl.textContent = message;
    }

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        if (!ONESIGNAL_APP_ID || ONESIGNAL_APP_ID === 'TON_ONESIGNAL_APP_ID') {
          setStatus('Il faut remplacer TON_ONESIGNAL_APP_ID dans index.html par ton vrai App ID OneSignal.');
          return;
        }

        await OneSignal.init({
          appId: ONESIGNAL_APP_ID,
          serviceWorkerParam: { scope: './' },
          serviceWorkerPath: 'OneSignalSDKWorker.js',
        });

        const permission = OneSignal.Notifications.permission;
        setStatus('OneSignal prêt. Autorisation actuelle : ' + permission);

        subscribeBtn.addEventListener('click', async function() {
          try {
            await OneSignal.Notifications.requestPermission();
            const optedIn = await OneSignal.User.PushSubscription.optedIn;
            const subscriptionId = OneSignal.User.PushSubscription.id || '';
            setStatus(
              'Autorisation : ' + OneSignal.Notifications.permission +
              '\nInscrit : ' + (optedIn ? 'oui' : 'non') +
              (subscriptionId ? '\nSubscription ID : ' + subscriptionId : '')
            );
          } catch (err) {
            setStatus('Erreur inscription : ' + (err && err.message ? err.message : String(err)));
          }
        });
      } catch (err) {
        setStatus('Erreur OneSignal : ' + (err && err.message ? err.message : String(err)));
      }
    });
  </script>
</body>
</html>
