<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5a0d0d">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Gestion Chambres Admin</title>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <style>
    :root{--brand:#5a0d0d;--bg:#f6f7f9;--text:#1f2937;--muted:#667085;--line:#d9dde3}
    *{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}
    header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
    .title{font-weight:800;color:var(--brand)} .actions{display:flex;gap:8px;flex-wrap:wrap}
    button,a.button{border:0;border-radius:8px;padding:9px 11px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
    .primary{background:var(--brand);color:#fff}.secondary{background:#eef0f3;color:#111827;border:1px solid #c8ced6}
    .status{font-size:12px;color:var(--muted);padding:0 14px 10px;background:#fff}
    iframe{display:block;width:100%;height:calc(100vh - 92px);border:0;background:#fff}
    @media(max-width:640px){header{align-items:flex-start;flex-direction:column}.actions{width:100%}.actions>*{flex:1;text-align:center}iframe{height:calc(100vh - 134px)}}
  </style>
</head>
<body>
  <header>
    <div class="title">Gestion Chambres Admin</div>
    <div class="actions">
      <button id="pushButton" class="primary" type="button">Activer les notifications</button>
      <a class="button secondary" href="https://script.google.com/macros/s/AKfycbybIF7v0Mz5Jah8Z9pxLPL37_kXKdSMsIqz_4Q3ZxRzJ6fxLD6iofUPnXB-ItTTNy69OA/exec?view=admin" target="_blank" rel="noopener">Ouvrir l’admin</a>
    </div>
  </header>
  <div id="pushStatus" class="status">Initialisation des notifications…</div>
  <iframe title="Administration réservations" src="https://script.google.com/macros/s/AKfycbybIF7v0Mz5Jah8Z9pxLPL37_kXKdSMsIqz_4Q3ZxRzJ6fxLD6iofUPnXB-ItTTNy69OA/exec?view=admin" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const APP_ID = 'c1c76342-2445-4ad8-9335-9563c23e9854';
    const SAFARI_WEB_ID = 'web.onesignal.auto.162dc776-ab2c-42c2-8206-1135116280d4';
    const statusEl = document.getElementById('pushStatus');
    const pushButton = document.getElementById('pushButton');

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: APP_ID,
        safari_web_id: SAFARI_WEB_ID,
        serviceWorkerPath: 'OneSignalSDKWorker.js',
        serviceWorkerParam: { scope: './' },
        notifyButton: { enable: false }
      });

      const refreshState = async () => {
        const permission = OneSignal.Notifications.permission;
        const optedIn = OneSignal.User.PushSubscription.optedIn;
        if (permission && optedIn) {
          statusEl.textContent = 'Notifications activées sur cet appareil.';
          pushButton.textContent = 'Notifications activées';
          pushButton.disabled = true;
        } else {
          statusEl.textContent = 'Notifications non activées sur cet appareil.';
          pushButton.textContent = 'Activer les notifications';
          pushButton.disabled = false;
        }
      };

      pushButton.addEventListener('click', async () => {
        try {
          statusEl.textContent = 'Demande d’autorisation…';
          await OneSignal.Notifications.requestPermission();
          await OneSignal.User.PushSubscription.optIn();
          await refreshState();
        } catch (err) {
          statusEl.textContent = 'Impossible d’activer les notifications : ' + (err && err.message ? err.message : String(err));
        }
      });

      OneSignal.Notifications.addEventListener('permissionChange', refreshState);
      OneSignal.User.PushSubscription.addEventListener('change', refreshState);
      await refreshState();
    });
  </script>
</body>
</html>
