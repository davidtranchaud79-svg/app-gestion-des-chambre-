<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin chambres</title>
  <meta name="theme-color" content="#7f1d1d">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fff;
      text-align: center;
      box-shadow: 0 18px 45px rgba(15, 23, 42, .1);
    }

    .icon {
      width: 92px;
      height: 92px;
      margin: 0 auto 16px;
      border-radius: 22px;
      display: block;
      box-shadow: 0 14px 30px rgba(127, 29, 29, .24);
    }

    h1 {
      margin: 0 0 10px;
      color: #7f1d1d;
      font-size: 30px;
    }

    p {
      color: #64748b;
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 0 20px;
      border-radius: 10px;
      background: #7f1d1d;
      color: #fff;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="./icon-192.png" alt="" aria-hidden="true">
    <h1>Admin chambres</h1>
    <p>Ouvre le tableau de bord de gestion des chambres.</p>
    <a href="https://script.google.com/macros/s/AKfycbyuWvq04pxNvszzTtSTHGrRJXCn8grvdNwmiz_c58aNcGaVcAX5EiQhF4bTxPyrOV389g/exec?view=admin">Ouvrir l'administration</a>
  </main>
</body>
</html>
