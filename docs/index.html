<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Union Compagnonnique Paris - Réservation chambre</title>
  <meta name="description" content="Accès au formulaire de réservation de chambre de l'Union Compagnonnique Paris.">
  <style>
    :root {
      --red: #f0243f;
      --red-dark: #b4152a;
      --blue: #173660;
      --blue-dark: #0d213e;
      --paper: #ffffff;
      --soft: #f4f6f9;
      --text: #1f2937;
      --muted: #64748b;
      --line: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 16% 18%, rgba(240, 36, 63, .13), transparent 28%),
        radial-gradient(circle at 86% 82%, rgba(23, 54, 96, .15), transparent 30%),
        linear-gradient(180deg, #fff 0%, var(--soft) 100%);
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .page {
      width: min(860px, 100%);
      padding: 34px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 28px 80px rgba(15, 23, 42, .14);
    }

    .brand {
      display: flex;
      justify-content: center;
      padding: 8px 12px 28px;
      border-bottom: 1px solid var(--line);
    }

    .brand img {
      width: min(560px, 100%);
      height: auto;
      display: block;
    }

    .booking {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 20px;
      align-items: center;
      margin-top: 28px;
      padding: 22px;
      border: 1px solid rgba(23, 54, 96, .14);
      border-radius: 10px;
      background: #fbfcff;
    }

    .bed {
      width: 78px;
      height: 78px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      flex: 0 0 auto;
    }

    .kicker {
      margin: 0 0 7px;
      color: var(--red);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--blue-dark);
      font-size: clamp(28px, 4.5vw, 44px);
      line-height: 1.06;
    }

    .lead {
      margin: 12px 0 0;
      max-width: 500px;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.48;
    }

    .cta {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      padding: 0 24px;
      border-radius: 8px;
      background: var(--red);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 14px 28px rgba(240, 36, 63, .24);
    }

    .cta:hover {
      background: var(--red-dark);
    }

    .direct {
      margin: 18px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .direct a {
      color: var(--blue);
      font-weight: 700;
    }

    .secondary-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
    }

    .secondary-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--blue);
      background: #fff;
      font-weight: 800;
      text-decoration: none;
    }

    @media (max-width: 760px) {
      .page {
        padding: 22px;
      }

      .brand {
        padding-bottom: 22px;
      }

      .booking {
        grid-template-columns: 1fr;
        justify-items: center;
        text-align: center;
      }

      .bed {
        width: 72px;
        height: 72px;
      }

      .lead {
        margin-left: auto;
        margin-right: auto;
      }

      .cta {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="page" aria-label="Réservation de chambre Union Compagnonnique Paris">
      <div class="brand">
        <img src="assets/logo-union-compagnonnique-paris.webp" alt="Union Compagnonnique Paris">
      </div>

      <div class="booking">
        <div class="bed" aria-hidden="true">
          <svg width="46" height="46" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 13v23" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            <path d="M7 26h34v10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M13 18h10a5 5 0 0 1 5 5v3H13v-8Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            <path d="M30 22h6a5 5 0 0 1 5 5v-1H30v-4Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
          </svg>
        </div>

        <div>
          <p class="kicker">Réservation chambre</p>
          <h1>Vérifier les disponibilités</h1>
          <p class="lead">Accédez au formulaire en ligne pour choisir les dates, la chambre et envoyer la demande à la réception.</p>
        </div>

        <a class="cta" href="https://script.google.com/macros/s/AKfycbybIF7v0Mz5Jah8Z9pxLPL37_kXKdSMsIqz_4Q3ZxRzJ6fxLD6iofUPnXB-ItTTNy69OA/exec" target="_blank" rel="noopener">Réserver</a>
      </div>

      <p class="direct">
        En cas de souci avec le bouton :
        <a href="https://script.google.com/macros/s/AKfycbybIF7v0Mz5Jah8Z9pxLPL37_kXKdSMsIqz_4Q3ZxRzJ6fxLD6iofUPnXB-ItTTNy69OA/exec" target="_blank" rel="noopener">ouvrir le formulaire directement</a>
      </p>

      <div class="secondary-links">
        <a class="secondary-link" href="notifications/">Activer les notifications portable</a>
        <a class="secondary-link" href="notifications.html">Lien de secours notifications</a>
      </div>
    </section>
  </main>
</body>
</html>
