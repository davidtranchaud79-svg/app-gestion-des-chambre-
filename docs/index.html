<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La Cayenne de Paris - Réservation chambre</title>
  <meta name="description" content="Réserver une chambre à La Cayenne de Paris.">
  <style>
    :root {
      --bordeaux: #681a1c;
      --bordeaux-dark: #3f0f11;
      --gold: #c89b5d;
      --cream: #f7efe5;
      --paper: #fffaf3;
      --ink: #271f1b;
      --muted: #74655d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(135deg, rgba(255,255,255,.08) 0 25%, transparent 25% 50%, rgba(255,255,255,.06) 50% 75%, transparent 75%) 0 0 / 36px 36px,
        linear-gradient(160deg, var(--bordeaux-dark), var(--bordeaux));
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
    }

    .panel {
      width: min(760px, 100%);
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 30px;
      align-items: center;
      padding: 34px;
      border: 1px solid rgba(255, 255, 255, .55);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .28);
    }

    .mark {
      display: grid;
      place-items: center;
      padding: 12px;
      border-right: 1px solid #eadccc;
    }

    .logo {
      width: min(230px, 100%);
      height: auto;
      display: block;
    }

    .content {
      min-width: 0;
    }

    .kicker {
      margin: 0 0 10px;
      color: var(--gold);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .09em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--bordeaux-dark);
      font-size: clamp(34px, 6vw, 56px);
      line-height: 1;
    }

    .lead {
      margin: 18px 0 0;
      max-width: 440px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.5;
    }

    .cta {
      display: inline-flex;
      min-height: 52px;
      align-items: center;
      justify-content: center;
      margin-top: 26px;
      padding: 0 24px;
      border-radius: 6px;
      background: var(--bordeaux);
      color: #fff;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 12px 24px rgba(104, 26, 28, .22);
    }

    .cta:hover {
      background: var(--bordeaux-dark);
    }

    .small {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .small a {
      color: var(--bordeaux);
      font-weight: 700;
    }

    @media (max-width: 720px) {
      .panel {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 24px 20px 28px;
        text-align: center;
      }

      .mark {
        border-right: 0;
        border-bottom: 1px solid #eadccc;
        padding-bottom: 18px;
      }

      .lead {
        margin-left: auto;
        margin-right: auto;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="panel" aria-label="Réservation de chambre La Cayenne de Paris">
      <div class="mark">
        <svg class="logo" viewBox="0 0 320 320" role="img" aria-label="La Cayenne de Paris, réservation chambre">
          <rect x="18" y="18" width="284" height="284" rx="8" fill="#fffaf3" stroke="#c89b5d" stroke-width="6"/>
          <circle cx="160" cy="126" r="86" fill="#681a1c"/>
          <circle cx="160" cy="126" r="70" fill="#fffaf3"/>
          <text x="160" y="155" text-anchor="middle" font-family="Georgia, serif" font-size="118" font-weight="700" fill="#681a1c" opacity=".08">C</text>
          <path d="M94 143V94c0-6 5-11 11-11h110c6 0 11 5 11 11v49" fill="none" stroke="#681a1c" stroke-width="9" stroke-linecap="round"/>
          <rect x="108" y="104" width="43" height="32" rx="7" fill="#efe2d1" stroke="#681a1c" stroke-width="5"/>
          <rect x="163" y="104" width="49" height="32" rx="7" fill="#efe2d1" stroke="#681a1c" stroke-width="5"/>
          <path d="M84 154h152" stroke="#681a1c" stroke-width="12" stroke-linecap="round"/>
          <path d="M88 171h144" stroke="#c89b5d" stroke-width="9" stroke-linecap="round"/>
          <path d="M98 154v35M222 154v35" stroke="#681a1c" stroke-width="8" stroke-linecap="round"/>
          <text x="160" y="238" text-anchor="middle" font-family="Georgia, serif" font-size="31" font-weight="700" fill="#271f1b">La Cayenne</text>
          <text x="160" y="270" text-anchor="middle" font-family="Georgia, serif" font-size="25" font-weight="700" fill="#271f1b">de Paris</text>
        </svg>
      </div>

      <div class="content">
        <p class="kicker">Gestion des chambres</p>
        <h1>Réserver une chambre</h1>
        <p class="lead">Vérifiez les disponibilités et envoyez votre demande directement à la réception.</p>
        <a class="cta" href="https://script.google.com/macros/s/AKfycbybIF7v0Mz5Jah8Z9pxLPL37_kXKdSMsIqz_4Q3ZxRzJ6fxLD6iofUPnXB-ItTTNy69OA/exec" target="_blank" rel="noopener">Accéder au formulaire</a>
        <p class="small">Lien officiel : <a href="https://script.google.com/macros/s/AKfycbybIF7v0Mz5Jah8Z9pxLPL37_kXKdSMsIqz_4Q3ZxRzJ6fxLD6iofUPnXB-ItTTNy69OA/exec" target="_blank" rel="noopener">ouvrir la réservation</a></p>
      </div>
    </section>
  </main>
</body>
</html>
