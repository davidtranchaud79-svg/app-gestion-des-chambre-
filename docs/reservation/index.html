<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réservation - Cayenne de Paris</title>
  <meta name="description" content="Accès au formulaire public de réservation des chambres de la Cayenne de Paris.">
  <meta name="theme-color" content="#1d3557">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="icon" href="../assets/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <style>
    :root {
      --blue: #1d3557;
      --blue-dark: #10223c;
      --red: #e72440;
      --soft: #f5f7fb;
      --text: #1f2937;
      --muted: #64748b;
      --line: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(231, 36, 64, .14), transparent 28%),
        radial-gradient(circle at 88% 86%, rgba(29, 53, 87, .16), transparent 30%),
        linear-gradient(180deg, #fff 0%, var(--soft) 100%);
    }

    main {
      width: min(560px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, .96);
      text-align: center;
      box-shadow: 0 24px 64px rgba(15, 23, 42, .14);
    }

    .logo {
      display: block;
      width: min(390px, 100%);
      height: auto;
      margin: 0 auto 24px;
    }

    .icon {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      margin: 0 auto 16px;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      box-shadow: 0 14px 30px rgba(29, 53, 87, .22);
    }

    h1 {
      margin: 0 0 10px;
      color: var(--blue-dark);
      font-size: clamp(29px, 6vw, 38px);
      line-height: 1.08;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .actions {
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    a {
      min-height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-radius: 10px;
      font-weight: 800;
      text-decoration: none;
    }

    .primary {
      background: var(--blue);
      color: #fff;
    }

    .primary:hover {
      background: var(--blue-dark);
    }

    .secondary {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--red);
    }

    svg {
      display: block;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="../assets/logo-union-compagnonnique-paris.webp" alt="Union Compagnonnique Paris">
    <div class="icon" aria-hidden="true">
      <svg width="38" height="38" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M7 13v23" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        <path d="M7 26h34v10" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M13 18h10a5 5 0 0 1 5 5v3H13v-8Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
        <path d="M30 22h6a5 5 0 0 1 5 5v-1H30v-4Z" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Réservation chambre</h1>
    <p>Ouvre le formulaire public pour vérifier les disponibilités et envoyer une demande.</p>
    <div class="actions">
      <a class="primary" href="https://script.google.com/macros/s/AKfycbz1X6pjRUH3d5xoOtYN6AE__eYkAC5VFjbmogWcYaiUS6A4tHonv8C32ygqPrJSaWOTkw/exec" rel="noopener">Ouvrir la réservation</a>
      <a class="secondary" href="../">Retour accueil</a>
    </div>
  </main>
</body>
</html>
